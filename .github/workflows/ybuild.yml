name: ybuild

on:
  workflow_dispatch:
  repository_dispatch: # 允许通过 API 触发

jobs:
  ybuild:
    runs-on: windows-latest
    name: Build Yim and Golt
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_LOGFILE: ${{ github.workspace }}\ccache-ybuild.log
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v6
        with:
            fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup .Net6.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0'

      - name: Setup Nuget
        uses: nuget/setup-nuget@v3

      - name: Restore ccache cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-ybuild-${{ github.ref_name }}-build1
          restore-keys: |
            ${{ runner.os }}-ccache-ybuild-${{ github.ref_name }}-
            ${{ runner.os }}-ccache-ybuild-

      - name: Install ccache
        run: choco install ccache -y

      - name: Initialize ccache
        shell: pwsh
        run: |
          "C:\Program Files\ccache" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $env:CCACHE_DIR | Out-Null
          if (Test-Path $env:CCACHE_LOGFILE) { Remove-Item -LiteralPath $env:CCACHE_LOGFILE -Force }
          ccache --zero-stats
          ccache --show-config
    
      - name: Check CMake version
        run: cmake --version
          
      - name: Checkout YimMenu Sources
        uses: actions/checkout@v6
        with:
          repository: sch-lda/YimMenu
          ref: 'upd-test'
          path: yimmenu
          fetch-depth: 1
          
      - name: download YimMenuV2 Sources
        run: |
          Invoke-WebRequest -Uri https://antfcc0.1007890.xyz/download_yimv2src -OutFile yimmenuv2.zip
          Expand-Archive -Path yimmenuv2.zip -DestinationPath ./
          
      - name: Checkout golt Sources
        uses: actions/checkout@v6
        with:
          repository: sch-lda/GTA5OnlineTools
          path: GTA5OnlineTools
          fetch-depth: 1


      - name: Generate YimmenuV2 CMake project
        run: cmake -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=RelWithDebInfo -S./yimmenuv2 -Bbuildv2 -G Ninja

      - name: Build YimmenuV2 64bit release DLL
        run: cmake --build ./buildv2 --config RelWithDebInfo --target YimMenuV2 --
          
      - name: proc Yim code
        run: |
             cd CIprop/
             ./autochsdownloader.exe ${{ secrets.ARG_V3 }}
             cd ..
             ./CIprop/tunow3npmsmq.exe ./yimmenu
             rm CIprop/tunow3npmsmq.exe
      
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
          
      - name: Generate Yimmenu CMake project
        run: cmake -D CMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -D OPTIMIZE=YES -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -S./yimmenu -Bbuild -G Ninja

      - name: Build Yimmenu 64bit release DLL
        run: cmake --build ./build --config RelWithDebInfo --target YimMenu --

      - name: Show ccache stats
        run: ccache --show-stats --verbose

      - name: Upload ccache log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ccache-ybuild-log
          path: ${{ env.CCACHE_LOGFILE }}
          if-no-files-found: warn

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: yimdll
          path: build/YimMenu.dll
          
      - name: Upload V2 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: yimv2dll
          path: buildv2/YimMenuV2.dll

      - name: ready for build golt
        run: |
             cp CIprop/aio_uploader.exe build/aio_uploader.exe
             cd build/
             ./aio_uploader.exe ${{ secrets.ARG_V2 }}
             cd ..
             mkdir GTA5OnlineTools/GTA5OnlineTools/Properties/PublishProfiles
             rm GTA5OnlineTools/GTA5Shared/Files/YimMenu/YimMenu.dll
             cp build/YimMenu.dll GTA5OnlineTools/GTA5Shared/Files/YimMenu/YimMenu.dll
             cp buildv2/YimMenuV2.dll GTA5OnlineTools/GTA5Shared/Files/YimMenu/NewBase.dll
             cp CIprop/FolderProfile.pubxml GTA5OnlineTools/GTA5OnlineTools/Properties/PublishProfiles/FolderProfile.pubxml
             cd GTA5OnlineTools/
             dotnet publish /p:Configuration=Release /p:PublishProfile=FolderProfile
             cd ..
             ./CIprop/t3ll2.exe ${{ secrets.ARG_V1 }}
             cp CIprop/aio_uploader.exe GTA5OnlineTools/GTA5OnlineTools/bin/x64/Release/net6.0-windows/publish/win-x64/
             cd GTA5OnlineTools/GTA5OnlineTools/bin/x64/Release/net6.0-windows/publish/win-x64/
             ./aio_uploader.exe ${{ secrets.ARG_V2 }}

      - name: Upload GTA5OnlineTools-CI
        uses: actions/upload-artifact@v7
        with:
          name: GTA5OnlineTools
          path: GTA5OnlineTools/GTA5OnlineTools/bin/x64/Release/net6.0-windows/publish/win-x64/GTA5OnlineTools.exe
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: CI
          tag_name: CI
          body: |
            **由于小助手已停止更新，自动构建程序将仅同步yimmenu**
          files: |
            GTA5OnlineTools/GTA5OnlineTools/bin/x64/Release/net6.0-windows/publish/win-x64/GTA5OnlineTools.exe
            build/YimMenu.dll
            buildv2/YimMenuV2.dll


